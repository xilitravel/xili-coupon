<script>

/* =========================================
   Apps Script Web App API
========================================= */

const API_URL =
  "https://script.google.com/macros/s/AKfycbywv7Fuhzi59rNfbNBsxCoZrxo9QCC5NRurcvOZYfhwRmKCDbeTHtj4hVwChTkqxwev4w/exec";


/* =========================================
   從網址取得優惠券序號

   GitHub Pages：
   https://xilitravel.github.io/xili-coupon/coupon.html?coupon=XL-XXXX-XXXX
========================================= */

const params =
  new URLSearchParams(window.location.search);

const couponCode =
  params.get("coupon") || "";


/* =========================================
   HTML 防止特殊字元
========================================= */

function escapeHtml(value) {

  return String(value ?? "")

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   顯示找不到優惠券
========================================= */

function showError(message) {

  const app =
    document.getElementById("app");

  app.innerHTML = `

    <div class="error-box">

      <div class="error-icon">
        ❌
      </div>

      <div class="error-title">
        找不到優惠券
      </div>

      <div class="error-text">

        ${
          escapeHtml(
            message ||
            "此優惠券不存在或連結錯誤"
          )
        }

      </div>

    </div>

  `;

}


/* =========================================
   GitHub Pages → Apps Script

   使用 JSONP 取得優惠券資料

   因為 GitHub Pages 和 Apps Script
   是不同網域，所以不用 google.script.run。
========================================= */

function loadCoupon() {

  if (!couponCode) {

    showError(
      "找不到優惠券編號，請確認連結是否正確"
    );

    return;

  }


  /* -----------------------------------------
     建立唯一 callback 名稱
  ----------------------------------------- */

  const callbackName =
    "couponCallback_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  /* -----------------------------------------
     建立 JSONP callback
  ----------------------------------------- */

  window[callbackName] =
    function(result) {

      try {

        /* Apps Script API 回傳錯誤 */

        if (
          !result ||
          result.success !== true
        ) {

          showError(
            result?.message ||
            "優惠券載入失敗"
          );

          return;

        }


        /* -----------------------------------
           真正的優惠券資料
        ----------------------------------- */

        renderCoupon(
          result.data
        );

      }

      catch (error) {

        console.error(
          "優惠券資料處理失敗：",
          error
        );

        showError(
          "優惠券資料載入失敗"
        );

      }

      finally {

        /* 清除 callback */

        try {

          delete window[callbackName];

        }

        catch (e) {}

      }

    };


  /* -----------------------------------------
     建立 API URL
  ----------------------------------------- */

  const url =
    API_URL +
    "?action=getcoupon" +
    "&code=" +
    encodeURIComponent(
      couponCode
    ) +
    "&prefix=" +
    encodeURIComponent(
      callbackName
    );


  /* -----------------------------------------
     使用 script 載入 JSONP

     這樣 GitHub Pages
     不需要直接處理 CORS。
  ----------------------------------------- */

  const script =
    document.createElement("script");


  script.src = url;

  script.async = true;


  /* -----------------------------------------
     API 連線錯誤
  ----------------------------------------- */

  script.onerror =
    function() {

      try {

        delete window[callbackName];

      }

      catch (e) {}


      showError(
        "優惠券載入失敗，請稍後再試"
      );

    };


  document.body.appendChild(
    script
  );

}


/* =========================================
   顯示優惠券
========================================= */

    );

  ----------------------------------------- */

     已使用
  ----------------------------------------- */

    data.status === "已使用"
  ) {

    statusClass =
      "used";

    statusText =
      "✓ 已使用";

     已過期
  ----------------------------------------- */

      <!-- 右邊 -->

  ====================================== -->

      </div>

    </div>


    <!-- 1 -->

    <div class="rule-row">

      </div>

      </div>

      <div class="rule-content">

        本折價券限於

        <span class="highlight">

        </span>

        ，實際適用團別及折抵金額依券面或活動公告為準。

      </div>

    </div>


    <!-- 2 -->

    <div class="rule-row">

      </div>

      <div class="rule-content">

        <span class="highlight">

        </span>

    <!-- 6 -->

    <div class="rule-row">

      <div class="rule-number">

      </div>

      </div>

      <div class="rule-content">

        請妥善保管本電子折價券及 QR Code，

   頁面載入完成
========================================= */

  "DOMContentLoaded",

  }
);

</script>
